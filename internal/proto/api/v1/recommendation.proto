message VerticalScalingOptimizationTarget {
    // Whether the optimization target is enabled
    bool enabled = 1;

    // The minimum request value that can be recommended
    optional int64 min_request = 11;

    // The maximum request value that can be recommended
    optional int64 max_request = 12;

    // (default: 1) can be used for workloads with higher SLOs to maintain performance.
    optional float overhead_multiplier = 21;

    // Resource-specific scaling behavior
    // Target percentile for resource sizing (0.0-1.0, e.g. 0.75 = P75)
    optional float target_percentile = 22;

    // Max % to scale up this resource in one step
    optional float max_scale_up_percent = 23;

    // Max % to scale down this resource in one step
    optional float max_scale_down_percent = 24;

    // Whether limits adjustment is enabled for this resource
    optional bool limits_adjustment_enabled = 26;

    // How much higher limits should be vs requests (e.g., 2.0 = 2x the request)
    optional float limit_multiplier = 27;

    // Minimum data points required for VPA on this specific resource
    optional int32 min_data_points = 31;

    // default MPA behavior is to recommend not adjusting req if they are not set; this flag overrides that behavior.
    bool adjust_req_even_if_not_set = 41;

    // Whether to actively remove limits from workloads (CPU only for now).
    // Takes precedence over limits_adjustment_enabled when true.
    bool limits_removal_enabled = 42;

    // Memory-only: when true, size the memory REQUEST recommendation from RSS
    // (resident set size) instead of the default working set. Ignored for CPU/GPU.
    optional bool request_use_rss = 43;

    // Memory-only: when true, the limit is derived from an RSS-based recommendation
    // instead of the default working-set recommendation (the Limit multiplier still
    // applies to whichever basis is selected). Ignored for CPU/GPU.
    optional bool limit_use_rss = 44;
}

message HorizontalScalingOptimizationTarget {
    // Whether the optimization target is enabled
    bool enabled = 1;

    // The minimum number of replicas for the optimization target
    optional int32 min_replicas = 11;

    // The maximum number of replicas for the optimization target
    optional int32 max_replicas = 12;

    // HPA-specific behavior
    // Target utilization for primary metric (e.g., 0.75 = 75% utilization)
    optional float target_utilization = 21;

    // Primary metric to use for horizontal scaling decisions
    optional HPAMetricType primary_metric = 22;

    // Minimum data points required for HPA decisions
    optional int32 min_data_points = 31;

    // Max % replica change in one step (e.g., 100 = can double or halve replicas)
    optional float max_replica_change_percent = 32;

    // Network throughput configuration for HPA scaling
    // Target network throughput per replica in bytes/sec
    // 0 = auto-detect from P95 + 15% headroom based on selected metric direction (ingress/egress)
    optional int64 network_target_throughput_bytes_per_sec = 41;

    // Target memory utilization for HPA scaling (0.0-1.0, e.g. 0.80 = 80%)
    // If unset, defaults to 0.80 (same as CPU default)
    optional float target_memory_utilization = 51;

    // Composite formula for multi-metric HPA scaling
    // Available variables: "cpu", "memory", "networkingress", "networkegress"
    // Each variable is the metric's current/target ratio (>1.0 = above target)
    // Example: "cpu * 0.6 + memory * 0.4"
    optional string composite_formula = 52;

    // Scale-down cooldown in seconds. Overrides the default K8s stabilization
    // window (300s). Use a higher value for workloads with slow drain or
    // connection-draining requirements.
    optional int32 scale_down_cooldown_seconds = 53;
}

message WorkloadRecommendationPolicy {
    string policy_id = 1;
    string team_id = 2;
    string name = 3;
    string description = 4;

    // The trigger for policy action, can be on schedule or on detection
    ActionTrigger action_trigger = 5 [deprecated = true];

    // The cron schedule for the policy, if action_trigger is on schedule
    optional string cron_schedule = 6;

    // The triggers for the policy, if action_trigger is on detection
    repeated WorkloadDetectionTrigger detection_triggers = 7;

    // The mode for the recommendation, can be balanced, aggressive, or conservative
    RecommendationMode recommendation_mode = 8 [deprecated = true];

    VerticalScalingOptimizationTarget cpu_vertical_scaling = 9;
    VerticalScalingOptimizationTarget memory_vertical_scaling = 10;
    VerticalScalingOptimizationTarget gpu_vertical_scaling = 11;
    VerticalScalingOptimizationTarget gpu_vram_vertical_scaling = 12;

    HorizontalScalingOptimizationTarget horizontal_scaling = 13;

    // The duration of the loopback window, this is the period of time to look back for resource usage data
    optional int32 loopback_period_seconds = 14;

    // Startup period of the workload, this is the period of time to ignore resource usage data after the workload is started
    optional int64 startup_period_seconds = 15;

    // Whether live migration is enabled for the workload policy.
    bool live_migration_enabled = 31;

    // default policy set by platform
    bool is_default_policy = 51;
    
    // List of workload UIDs attached to this policy
    repeated string workload_uids = 57;

    // ordered list of scheduler plugins
    repeated string scheduler_plugins = 61;
    optional string defragmentation_schedule = 62; // only relevant when dz-scheduler set

    repeated ActionTrigger action_triggers = 71;


    // Global minimum change threshold - applies to all recommendations
    // Only changes above this percentage will be applied (prevents micro-adjustments)
    optional float min_change_percent = 86;

    // Global data quality requirements
    // Minimum data points for any recommendation (global threshold)
    optional int32 min_data_points = 89;

    // VPA/HPA orchestration parameters
    // These control the decision-making between vertical and horizontal scaling

    // Maximum coefficient of variation for workload to be considered stable
    optional float stability_cv_max = 92;

    // Hysteresis threshold vs target for HPA coordination (prevents oscillation)
    optional float hysteresis_vs_target = 93;

    // Percentage drift from baseline that triggers VPA refresh
    optional float drift_delta_percent = 94;

    // Minimum data points in VPA analysis window
    optional int32 min_vpa_window_data_points = 95;

    // Global cooldown configuration
    // Minutes to wait between applying recommendations (prevents thrashing)
    optional int32 cooldown_minutes = 96;

    reserved 97;
    reserved "enable_incluster_mpa";

    // Feature flag: Enable In-Place Pod Vertical Scaling for this policy.
    // Requires Kubernetes >= v1.33 on all attached clusters.
    // When enabled, recommendations resize running pods via the /resize subresource
    // without triggering rolling restarts.
    bool enable_in_place_vertical_scaling = 103;

    // Opt-in escape hatch for the riskiest half of in-place scaling: allowing a
    // resize to LOWER a container's memory limit on a running pod. Gated behind
    // enable_in_place_vertical_scaling and, independently, behind the cluster's
    // Kubernetes version — this flag only ever removes DevZero's own refusal, it
    // never makes an unsupported cluster accept the decrease. Default false.
    bool allow_in_place_memory_limit_decrease = 121;

    // Policy-driven automation: enable PDB creation for workloads under this policy
    bool pdb_enabled = 98;

    EmergencyResponseConfig emergency_response = 99;

    // Pmax spike protection: raises resource requests to cover peak usage
    // when the max-observed-to-recommendation ratio exceeds the threshold.
    bool enable_pmax_protection = 100;
    optional float pmax_ratio_threshold = 101; // default: 3.0

    optional google.protobuf.Timestamp deleted_at = 102;

    // JVM heap optimization. Gated by jvm_heap_optimization_enabled; the optional
    // knobs are overrides — unset means "use the current system default".
    bool jvm_heap_optimization_enabled = 104;
    optional float jvm_heap_target_percentile = 105;
    optional float jvm_heap_headroom_multiplier = 106;
    optional float jvm_non_heap_overhead_percent = 107;
    optional int64 jvm_non_heap_overhead_bytes = 108;
    optional int64 jvm_min_heap_bytes = 109;
    optional int64 jvm_max_heap_bytes = 110;
    bool jvm_prefer_container_support = 111;

    // Minimum CPU request (millicores) for detected JVM containers, protecting
    // JVM startup (classloading, JIT warmup, agent instrumentation) from CPU
    // starvation under node contention. Standalone knob — part of the always-on
    // "respect JVM state" path, NOT gated by jvm_heap_optimization_enabled.
    // Unset = system default (75m). Explicit 0 = floor disabled (only the
    // generic CPU minimum applies).
    optional int64 jvm_cpu_startup_floor_millicores = 112;

    // Recommendation floor percentage (per resource, request only): the
    // recommended request is never lowered below pct% (1-100) of the
    // container's immutable initial-request baseline
    // (workload_resource_baselines). Unset = floor disabled.
    optional int64 cpu_floor_percent = 113;
    optional int64 memory_floor_percent = 114;

    // Recommendation ceiling percentage (per resource, request only): the
    // recommended request is never raised above pct% (1-1000) of the
    // container's immutable initial-request baseline
    // (workload_resource_baselines). A ceiling below 100 is intentionally
    // allowed as a baseline-relative cap distinct from max_request. Unset =
    // ceiling disabled.
    optional int64 cpu_ceiling_percent = 115;
    optional int64 memory_ceiling_percent = 116;

    // Limit floor/ceiling percentage (per resource, limit only): the
    // recommended limit is never lowered below the floor pct (1-100) nor
    // raised above the ceiling pct (1-1000) of the container's immutable
    // initial-limit baseline (workload_resource_baselines). Applied only when
    // that resource's limits adjustment is enabled and limits removal is not;
    // the recommended request always wins over the limit ceiling (the limit
    // is never clamped below the request). Unset = bound disabled.
    optional int64 cpu_limit_floor_percent = 117;
    optional int64 memory_limit_floor_percent = 118;
    optional int64 cpu_limit_ceiling_percent = 119;
    optional int64 memory_limit_ceiling_percent = 120;
}

